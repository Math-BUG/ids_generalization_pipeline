dataset_name: ton_iot
synthetic_n: 300
label_col: label
type_col: type
feature_policy: no_raw_ip_port
compute_backend: auto

split_strategy: random_stratified
test_size: 0.25
val_size: 0.20

svd_components: 50
onehot_min_frequency: 20
gpu_max_categories_per_col: 64
log1p_numeric: true
log1p_patterns: ["bytes", "pkts", "packets", "count", "duration"]

selected_k: 30
cluster_batch_size: 16384
cluster_n_init: 5
cluster_max_iter: 100
silhouette_sample_size: 10000

random_forest_estimators: 50
random_state: 42
n_jobs: 1
log_level: INFO
