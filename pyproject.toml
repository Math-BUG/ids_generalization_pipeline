[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-generalization-pipeline"
version = "0.1.0"
description = "Reproducible IoT/NIDS intrusion detection experiments with anti-leakage feature policies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IDS Generalization Pipeline" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.1",
  "scipy>=1.9",
  "PyYAML>=6.0",
  "joblib>=1.2",
  "psutil>=5.9",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
ids-pipeline = "ids_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
